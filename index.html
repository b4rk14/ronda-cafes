<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafés & Desayunos</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#8B5E3C" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>☕ Cafés & Desayunos</h1>

    <div class="card">
      <h2>Grupo</h2>
      <select id="groupSelect">
        <option>Amigos</option>
      </select>
    </div>

    <div class="card">
      <h2>¿Quién paga?</h2>
      <p id="selectedPerson" class="selected">Pulsa el botón para elegir</p>

      <button id="pickButton" class="primary">
        Elegir quién paga
      </button>

      <button id="confirmButton" disabled>
        Confirmar pago
      </button>
    </div>

    <div class="card">
      <h2>Contador</h2>
      <ul id="counterList">
        <li>Ana — 0</li>
        <li>Iván — 0</li>
        <li>Luis — 0</li>
        <li>Breo — 0</li>
      </ul>
    </div>

    <div class="card">
      <h2>Historial</h2>
      <ul id="historyList">
        <li>Aún no hay registros</li>
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
