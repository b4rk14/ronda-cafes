<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cafés & Desayunos</title>

  <meta name="theme-color" content="#081427" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

<!-- Cabecera -->
<header class="header">
  <button class="menu-button" aria-label="Menú">⋮</button>

  <div class="header-text">
    <h1 id="groupName">Perenquenes</h1>
    <p class="subtitle">☕ Cafés & Desayunos</p>
  </div>
</header>

    <!-- Siguiente pagador -->
    <section class="card next-card">
      <h2>Siguiente pagador</h2>
      <div id="nextPayer" class="next-payer">Luis</div>
    </section>

<!-- Contadores -->
<section class="card">
  <h2>Contadores</h2>

  <div id="countersContainer">
    <!-- Los contadores se generan desde app.js -->
  </div>
</section>

    <!-- Botón principal -->
    <section class="card action-card">
      <button id="registerButton" class="primary-button">
        Registrar Café / Desayuno
      </button>
    </section>

<!-- Historial -->
<section class="card">
  <h2>Historial</h2>
  <!-- El historial se genera desde app.js -->
</section>

  </div>

  <script src="app.js"></script>
</body>
</html>
